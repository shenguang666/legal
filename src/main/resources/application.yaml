spring:
  application:
    name: legal
  profiles:
    active: ${LEGAL_PROFILE:dev}
  servlet:
    multipart:
      max-file-size: ${LEGAL_KB_UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${LEGAL_KB_UPLOAD_MAX_REQUEST_SIZE:20MB}

server:
  port: ${LEGAL_SERVER_PORT:8081}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-read-header: true
  is-log: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: info
    com.legal: info

# LangChain4j 与 RAG 配置。
langchain4j:
  open-ai:
    chat-model:
      base-url: ${LEGAL_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${LEGAL_LLM_API_KEY:sk-8f14b342380c4e1ea5bbf457709c5f12}
      model-name: ${LEGAL_LLM_MODEL:qwen-plus}
      temperature: ${LEGAL_LLM_TEMPERATURE:0.2}
      max-output-tokens: ${LEGAL_LLM_MAX_OUTPUT_TOKENS:2048}
      timeout: ${LEGAL_LLM_TIMEOUT:60s}
      log-requests: ${LEGAL_LLM_LOG_REQUESTS:false}
      log-responses: ${LEGAL_LLM_LOG_RESPONSES:false}
    embedding-model:
      base-url: ${LEGAL_LLM_EMBEDDING_BASE_URL:${LEGAL_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      api-key: ${LEGAL_LLM_EMBEDDING_API_KEY:${LEGAL_LLM_API_KEY:sk-8f14b342380c4e1ea5bbf457709c5f12}}
      model-name: ${LEGAL_LLM_EMBEDDING_MODEL:text-embedding-v3}
      dimensions: ${LEGAL_LLM_EMBEDDING_DIMENSIONS:1024}
      timeout: ${LEGAL_LLM_EMBEDDING_TIMEOUT:30s}
      log-requests: ${LEGAL_LLM_EMBEDDING_LOG_REQUESTS:false}
      log-responses: ${LEGAL_LLM_EMBEDDING_LOG_RESPONSES:false}

# RAG 运行参数。
rag:
  # 是否启用基础 RAG。
  enabled: ${LEGAL_RAG_ENABLED:true}
  # 检索返回的最大切片数。
  top-k: ${LEGAL_RAG_TOP_K:5}
  # 向量召回的最小相似度阈值（cosine similarity）。低于阈值的召回会被丢弃；不会强制补齐 topK。
  min-vector-similarity: ${LEGAL_RAG_MIN_VECTOR_SIMILARITY:0.9}
  # 会话记忆最多保留多少条消息。
  max-memory-messages: ${LEGAL_RAG_MAX_MEMORY_MESSAGES:12}
  # 无检索结果时返回的提示语。
  empty-hit-warning: ${LEGAL_RAG_EMPTY_HIT_WARNING:当前知识库暂无直接相关内容，以下回答仅基于通用法律知识整理，请谨慎核对。}

# Elasticsearch 配置（文档向量索引 + 混合检索）。
elasticsearch:
  enabled: ${LEGAL_ES_ENABLED:true}
  uris:
    - ${LEGAL_ES_URIS:http://159.75.84.229:9200}
  username: ${LEGAL_ES_USERNAME:elastic}
  password: ${LEGAL_ES_PASSWORD:elastic99801}
  connect-timeout: ${LEGAL_ES_CONNECT_TIMEOUT:3s}
  socket-timeout: ${LEGAL_ES_SOCKET_TIMEOUT:10s}
  connection-request-timeout: ${LEGAL_ES_CONNECTION_REQUEST_TIMEOUT:2s}
  max-connections: ${LEGAL_ES_MAX_CONNECTIONS:100}
  max-connections-per-route: ${LEGAL_ES_MAX_CONNECTIONS_PER_ROUTE:100}
  log-requests: ${LEGAL_ES_LOG_REQUESTS:false}

  index:
    kb-chunks: ${LEGAL_ES_INDEX_KB_CHUNKS:legal_kb_chunks_v1}
    retrieval-log: ${LEGAL_ES_INDEX_RETRIEVAL_LOG:legal_retrieval_log_v1}
    vector-dims: ${LEGAL_ES_VECTOR_DIMS:${LEGAL_LLM_EMBEDDING_DIMENSIONS:1024}}

  search:
    vector-top-k: ${LEGAL_ES_VECTOR_TOP_K:80}
    bm25-top-k: ${LEGAL_ES_BM25_TOP_K:80}
    rrf-k: ${LEGAL_ES_RRF_K:60}
    rerank-top-n: ${LEGAL_ES_RERANK_TOP_N:20}

  worker:
    enabled: ${LEGAL_ES_WORKER_ENABLED:true}
    batch-size: ${LEGAL_ES_WORKER_BATCH_SIZE:10}
    poll-interval: ${LEGAL_ES_WORKER_POLL_INTERVAL:3s}
    poll-interval-ms: ${LEGAL_ES_WORKER_POLL_INTERVAL_MS:3000}
    max-retries: ${LEGAL_ES_WORKER_MAX_RETRIES:5}
    retry-delay: ${LEGAL_ES_WORKER_RETRY_DELAY:30s}

