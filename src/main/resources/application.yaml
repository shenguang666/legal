# Spring Boot 基础配置。
spring:
  # 应用元信息配置。
  application:
    # Spring 应用名称，用于日志、监控和服务标识。
    name: legal
  # Spring Profile 激活配置。
  profiles:
    # 当前激活的运行环境，默认使用 dev。
    active: ${LEGAL_PROFILE:dev}
  # Spring Data Neo4j 连接配置（用于智能小法庭证据链知识图谱）。
  neo4j:
    # Neo4j Bolt 协议连接地址，生产建议通过环境变量注入。
    uri: ${LEGAL_NEO4J_URI:bolt://159.75.84.229:7687}
    # Neo4j 连接超时时间。
    connection-timeout: ${LEGAL_NEO4J_CONNECTION_TIMEOUT:10s}
    # Neo4j 驱动认证配置。
    authentication:
      # Neo4j 登录用户名，社区版默认 neo4j。
      username: ${LEGAL_NEO4J_USERNAME:neo4j}
      # Neo4j 登录密码，生产请通过环境变量注入。
      password: ${LEGAL_NEO4J_PASSWORD:legalNeo4j2026!}
  # Spring Data 数据访问配置。
  data:
    # Spring Data Neo4j 业务数据库配置。
    neo4j:
      # Neo4j 业务数据库名称，Community 版通常使用默认 neo4j。
      database: ${LEGAL_NEO4J_DATABASE:neo4j}
    # Redis 连接配置。
    redis:
      # Redis 主机地址。
      host: ${LEGAL_REDIS_HOST:159.75.84.229}
      # Redis 服务端口。
      port: ${LEGAL_REDIS_PORT:6379}
      # Redis 访问密码。
      password: ${LEGAL_REDIS_PASSWORD:reidsnfturbo11}
      # Redis 命令执行超时时间。
      timeout: 3s
  # dev 环境数据库连接配置。
  datasource:
    # MySQL JDBC 连接地址。
    url: ${LEGAL_DB_URL:jdbc:mysql://159.75.84.229:3307/legal?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    # MySQL 登录用户名。
    username: ${LEGAL_DB_USERNAME:legal}
    # MySQL 登录密码，生产环境应通过环境变量注入。
    password: ${LEGAL_DB_PASSWORD:c5S6sixmyYcS4xxX}
    # MySQL JDBC 驱动类名。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 数据库连接池配置。
    hikari:
      # 初始化失败超时时间，-1 表示启动时不因数据库暂不可用而失败。
      initialization-fail-timeout: -1
  # Servlet 容器相关配置。
  servlet:
    # 文件上传大小限制配置。
    multipart:
      # 单个上传文件允许的最大大小。
      max-file-size: ${LEGAL_KB_UPLOAD_MAX_FILE_SIZE:20MB}
      # 单次 multipart 请求允许的最大大小。
      max-request-size: ${LEGAL_KB_UPLOAD_MAX_REQUEST_SIZE:20MB}

# Web 服务端口配置。
server:
  # 后端 HTTP 服务监听端口。
  port: ${LEGAL_SERVER_PORT:8081}

# MyBatis-Plus ORM 配置。
mybatis-plus:
  # MyBatis 运行行为配置。
  configuration:
    # 是否自动将数据库下划线字段映射为 Java 驼峰属性。
    map-underscore-to-camel-case: true
  # MyBatis-Plus 全局配置。
  global-config:
    # 是否显示 MyBatis-Plus 启动 Banner。
    banner: false

# Spring Boot Actuator 监控端点配置。
management:
  # Actuator 端点暴露配置。
  endpoints:
    # Web 方式访问的端点配置。
    web:
      # Web 端点暴露范围配置。
      exposure:
        # 对外暴露的 Actuator 端点列表。
        include: health,info,metrics
  # 单个 Actuator 端点配置。
  endpoint:
    # 健康检查端点配置。
    health:
      # 健康检查是否显示详细信息。
      show-details: always

# Sa-Token 登录认证与鉴权配置。
sa-token:
  # Token 在请求头中的名称。
  token-name: Authorization
  # Token 前缀，前端传入时形如 Bearer xxx。
  token-prefix: Bearer
  # Token 有效期秒数。
  timeout: 2592000
  # Token 临时有效期，-1 表示不限制活跃超时。
  active-timeout: -1
  # 是否允许同一账号并发登录。
  is-concurrent: true
  # 并发登录时是否共用同一个 Token。
  is-share: false
  # 是否从 Cookie 中读取 Token。
  is-read-cookie: false
  # 是否从请求头中读取 Token。
  is-read-header: true
  # 是否开启 Sa-Token 操作日志。
  is-log: false

# 日志输出配置。
logging:
  # 日志格式配置。
  pattern:
    # 控制台日志输出格式，包含 traceId 便于问题排查。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  # 日志级别配置。
  level:
    # 全局默认日志级别。
    root: info
    # 项目包日志级别。
    com.legal: info

# LangChain4j 与 RAG 配置。
langchain4j:
  # OpenAI 兼容协议模型配置。
  open-ai:
    # 普通非流式聊天模型配置。
    chat-model:
      # 聊天模型 OpenAI 兼容接口地址。
      base-url: ${LEGAL_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 聊天模型 API Key，生产环境应通过环境变量注入。
      api-key: ${LEGAL_LLM_API_KEY:sk-8f14b342380c4e1ea5bbf457709c5f12}
      # 聊天模型名称。
      model-name: ${LEGAL_LLM_MODEL:deepseek-v4-pro}
      # 聊天模型采样温度，值越低回答越稳定。
      temperature: ${LEGAL_LLM_TEMPERATURE:0.2}
      # 聊天模型单次回答最大输出 Token 数。
      max-output-tokens: ${LEGAL_LLM_MAX_OUTPUT_TOKENS:2048}
      # 聊天模型调用超时时间。
      timeout: ${LEGAL_LLM_TIMEOUT:60s}
      # 是否记录聊天模型请求日志。
      log-requests: ${LEGAL_LLM_LOG_REQUESTS:false}
      # 是否记录聊天模型响应日志。
      log-responses: ${LEGAL_LLM_LOG_RESPONSES:false}

    # 流式聊天模型配置（SSE 流式问答用）。默认复用 chat-model 的 base-url/api-key/model。
    streaming-chat-model:
      # 流式聊天模型 OpenAI 兼容接口地址。
      base-url: ${LEGAL_LLM_STREAM_BASE_URL:${LEGAL_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      # 流式聊天模型 API Key，默认复用普通聊天模型 API Key。
      api-key: ${LEGAL_LLM_STREAM_API_KEY:${LEGAL_LLM_API_KEY:sk-8f14b342380c4e1ea5bbf457709c5f12}}
      # 流式聊天模型名称，默认复用普通聊天模型名称。
      model-name: ${LEGAL_LLM_STREAM_MODEL:${LEGAL_LLM_MODEL:deepseek-v4-pro}}
      # 流式聊天模型采样温度，默认复用普通聊天模型温度。
      temperature: ${LEGAL_LLM_STREAM_TEMPERATURE:${LEGAL_LLM_TEMPERATURE:0.2}}
      # 流式聊天模型单次回答最大输出 Token 数。
      max-output-tokens: ${LEGAL_LLM_STREAM_MAX_OUTPUT_TOKENS:${LEGAL_LLM_MAX_OUTPUT_TOKENS:2048}}
      # 流式聊天模型调用超时时间。
      timeout: ${LEGAL_LLM_STREAM_TIMEOUT:${LEGAL_LLM_TIMEOUT:60s}}
    # Embedding 向量模型配置。
    embedding-model:
      # Embedding 模型 OpenAI 兼容接口地址。
      base-url: ${LEGAL_LLM_EMBEDDING_BASE_URL:${LEGAL_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      # Embedding 模型 API Key，默认复用普通聊天模型 API Key。
      api-key: ${LEGAL_LLM_EMBEDDING_API_KEY:${LEGAL_LLM_API_KEY:sk-8f14b342380c4e1ea5bbf457709c5f12}}
      # Embedding 模型名称。
      model-name: ${LEGAL_LLM_EMBEDDING_MODEL:text-embedding-v3}
      # Embedding 向量维度，需与 Elasticsearch 索引维度一致。
      dimensions: ${LEGAL_LLM_EMBEDDING_DIMENSIONS:1024}
      # Embedding 模型调用超时时间。
      timeout: ${LEGAL_LLM_EMBEDDING_TIMEOUT:30s}

# RAG 运行参数。
rag:
  # 是否启用基础 RAG。
  enabled: ${LEGAL_RAG_ENABLED:true}
  # 检索返回的最大切片数。
  top-k: ${LEGAL_RAG_TOP_K:5}
  # 向量召回的最小相似度阈值（cosine similarity）。低于阈值的召回会被丢弃；不会强制补齐 topK。
  min-vector-similarity: ${LEGAL_RAG_MIN_VECTOR_SIMILARITY:0.8}
  # 会话记忆最多保留多少条消息（非流式）。
  max-memory-messages: ${LEGAL_RAG_MAX_MEMORY_MESSAGES:12}
  # 无检索结果时返回的提示语。
  empty-hit-warning: ${LEGAL_RAG_EMPTY_HIT_WARNING:当前知识库暂无直接相关内容，以下回答仅基于通用法律知识整理，请谨慎核对。}
  # RAG 检索质量指标配置。
  metric:
    # RAG 检索质量评估配置。
    retrieval:
      # 是否启用 RAG 检索质量评估定时任务，默认开启以支持每日指标统计。
      enabled: ${RAG_METRIC_RETRIEVAL_ENABLED:true}
      # 定时评估任务配置。
      worker:
        # RAG 检索质量评估定时任务 Cron 表达式，默认低峰期 02:00-05:59 每 5 分钟执行一次。
        cron: ${RAG_METRIC_RETRIEVAL_WORKER_CRON:0 0/20 * * * ?}
        # 单次任务最多处理多少条检索日志，仅限制单批大小，不限制每日总量。
        batch-size: ${RAG_METRIC_RETRIEVAL_WORKER_BATCH_SIZE:20}
        # 定时任务默认处理距离当前日期多少天的业务日期，1 表示处理上一自然日。
        metric-date-offset-days: ${RAG_METRIC_RETRIEVAL_WORKER_METRIC_DATE_OFFSET_DAYS:1}
        # 检索日志扫描失败后允许的最大重试次数。
        max-retries: ${RAG_METRIC_RETRIEVAL_WORKER_MAX_RETRIES:3}
        # 评估任务并发数量上限。
        concurrency: ${RAG_METRIC_RETRIEVAL_WORKER_CONCURRENCY:1}
        # 单条检索日志评估超时时间。
        timeout: ${RAG_METRIC_RETRIEVAL_WORKER_TIMEOUT:90s}
      # 离线候选召回配置。
      candidate-recall:
        # 每条 query 粗召回的候选切片数量。
        top-n: ${RAG_METRIC_RETRIEVAL_CANDIDATE_TOP_N:200}
        # 从粗召回候选中送入大模型精筛的比例。
        judge-candidate-ratio: ${RAG_METRIC_RETRIEVAL_JUDGE_CANDIDATE_RATIO:0.05}
        # 送入大模型精筛的候选切片数量下限。
        min-judge-candidates: ${RAG_METRIC_RETRIEVAL_MIN_JUDGE_CANDIDATES:10}
        # 送入大模型精筛的候选切片数量上限。
        max-judge-candidates: ${RAG_METRIC_RETRIEVAL_MAX_JUDGE_CANDIDATES:20}
        # 单个切片送入大模型判断时保留的最大字符数。
        max-chunk-chars: ${RAG_METRIC_RETRIEVAL_MAX_CHUNK_CHARS:500}
      # 待评估 query 过滤配置。
      query-filter:
        # 待评估 query 的最小有效字符数，低于该长度会跳过。
        min-query-length: ${RAG_METRIC_RETRIEVAL_MIN_QUERY_LENGTH:6}
        # 低价值或寒暄类 query 黑名单，命中后会跳过评估。
        excluded-queries:
      # 大模型评估配置。
      judge-model:
        # 评估提示词版本，用于区分不同评估口径。
        prompt-version: ${RAG_METRIC_RETRIEVAL_PROMPT_VERSION:rag-metric-v3}
        # 专用评估模型名称；为空时复用在线问答模型。
        model-name: ${RAG_METRIC_RETRIEVAL_MODEL_NAME:qwen3.6-plus}
        # 单次模型判断最多输出 token 数。
        max-output-tokens: ${RAG_METRIC_RETRIEVAL_MAX_OUTPUT_TOKENS:1200}

# Token 统计与指标配置。
token:
  # Token 消耗指标配置。
  metric:
    # 在线问答 Token 消耗日统计配置。
    usage:
      # 是否启用 Token 消耗统计定时任务。
      enabled: ${TOKEN_METRIC_USAGE_ENABLED:true}
      # Token 消耗统计版本，用于隔离不同统计口径。
      version: ${TOKEN_METRIC_USAGE_VERSION:token-usage-v1}
      # Token 消耗统计定时任务配置。
      worker:
        # Token 消耗统计定时任务 Cron 表达式，默认低峰期 02:00-05:59 每 5 分钟执行一次。
        cron: ${TOKEN_METRIC_USAGE_WORKER_CRON:0 0/5 2-5 * * ?}
        # 单次定时任务最多处理的租户数量。
        batch-size: ${TOKEN_METRIC_USAGE_WORKER_BATCH_SIZE:20}
        # 定时任务默认处理距离当前日期多少天的业务日期，1 表示处理上一自然日。
        metric-date-offset-days: ${TOKEN_METRIC_USAGE_WORKER_METRIC_DATE_OFFSET_DAYS:1}
        # 单个租户日期统计失败后允许的最大重试次数。
        max-retries: ${TOKEN_METRIC_USAGE_WORKER_MAX_RETRIES:3}
        # 单个租户日期统计任务超时时间。
        timeout: ${TOKEN_METRIC_USAGE_WORKER_TIMEOUT:90s}
      # Token 消耗 Top 用户排行配置。
      top-users:
        # 每个指标日期保留 Token 消耗最高的用户数量。
        limit: ${TOKEN_METRIC_USAGE_TOP_USERS_LIMIT:10}


# 记忆管理配置（agent 上下文记忆：短期/摘要/长期）。
legal:
  # 文档图片等资产的对象存储配置。
  storage:
    # 阿里云 OSS 文档资产存储配置。
    oss:
      # 是否启用阿里云 OSS 文档资产上传能力。
      enabled: ${LEGAL_OSS_ENABLED:true}
      # OSS 区域标识，例如 cn-hangzhou。
      region: ${LEGAL_OSS_REGION:cn-guangzhou}
      # OSS 访问端点，例如 https://oss-cn-hangzhou.aliyuncs.com。
      endpoint: ${LEGAL_OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
      # OSS Bucket 名称。
      bucket: ${LEGAL_OSS_BUCKET:web-legal}
      # 项目自定义 OSS AccessKey ID。
      access-key-id: ${LEGAL_OSS_ACCESS_KEY_ID:}
      # 项目自定义 OSS AccessKey Secret。
      access-key-secret: ${LEGAL_OSS_ACCESS_KEY_SECRET:}
      # OSS 公开访问域名，为空时通过后端生成私有签名 URL。
      public-base-url: ${LEGAL_OSS_PUBLIC_BASE_URL:}
      # 私有 Bucket 图片访问签名 URL 有效期。
      presigned-url-expiration: ${LEGAL_OSS_PRESIGNED_URL_EXPIRATION:1h}

  # 文档上传、解析方式选择和语义切片配置。
  document-processing:
    # 未显式选择解析方式时使用的默认解析方式，支持 NATIVE 和 MINERU_PRECISE。
    default-parse-method: ${LEGAL_DOCUMENT_DEFAULT_PARSE_METHOD:NATIVE}
    # 单次上传请求允许的最大文档数量。
    max-upload-documents: ${LEGAL_DOCUMENT_MAX_UPLOAD_DOCUMENTS:5}
    # 超长语义块兜底字符切分时的重叠字符数。
    fallback-overlap: ${LEGAL_DOCUMENT_CHUNKING_FALLBACK_OVERLAP:0}
    # 文档内容清洗配置，前端上传时默认关闭，用户主动开启后才执行。
    cleaning:
      # 是否开放文档清洗能力，关闭后前端即使提交开启参数也不会执行清洗。
      enabled: ${LEGAL_DOCUMENT_CLEANING_ENABLED:true}
      # 重复页眉页脚检测时扫描每页开头和结尾的行数。
      header-footer-scan-lines: ${LEGAL_DOCUMENT_CLEANING_HEADER_FOOTER_SCAN_LINES:3}
      # 重复行被判定为页眉页脚候选时需要达到的最小出现次数。
      repeated-line-min-occurrences: ${LEGAL_DOCUMENT_CLEANING_REPEATED_LINE_MIN_OCCURRENCES:3}
      # 重复行被判定为页眉页脚候选时需要覆盖的最小页面比例。
      repeated-line-page-ratio: ${LEGAL_DOCUMENT_CLEANING_REPEATED_LINE_PAGE_RATIO:0.6}
      # 重复短行参与页眉页脚候选判断的最大字符长度。
      repeated-line-max-length: ${LEGAL_DOCUMENT_CLEANING_REPEATED_LINE_MAX_LENGTH:80}
      # 切块后保留切片的最小有效字符数，法律短标题和编号条款不受该限制。
      min-effective-chunk-length: ${LEGAL_DOCUMENT_CLEANING_MIN_EFFECTIVE_CHUNK_LENGTH:20}
      # 清洗日志中最多保存多少条被移除内容预览样例，不限制全文清洗范围。
      removed-sample-limit: ${LEGAL_DOCUMENT_CLEANING_REMOVED_SAMPLE_LIMIT:50}
      # 清洗日志中每条被移除内容预览样例最多保存多少个字符，不截断原文档或实际清洗内容。
      removed-sample-max-chars: ${LEGAL_DOCUMENT_CLEANING_REMOVED_SAMPLE_MAX_CHARS:500}
      # 是否启用页码类噪声过滤规则。
      remove-page-numbers: ${LEGAL_DOCUMENT_CLEANING_REMOVE_PAGE_NUMBERS:true}
      # 是否启用版权声明类噪声过滤规则。
      remove-copyright-lines: ${LEGAL_DOCUMENT_CLEANING_REMOVE_COPYRIGHT_LINES:true}
      # 是否启用官网或系统导出元数据过滤规则。
      remove-export-metadata: ${LEGAL_DOCUMENT_CLEANING_REMOVE_EXPORT_METADATA:true}
      # 是否启用孤立 URL 行过滤规则。
      remove-standalone-urls: ${LEGAL_DOCUMENT_CLEANING_REMOVE_STANDALONE_URLS:true}
      # 是否启用重复页眉页脚过滤规则。
      remove-repeated-header-footer: ${LEGAL_DOCUMENT_CLEANING_REMOVE_REPEATED_HEADER_FOOTER:true}
    # MinerU 精准解析配置，Token 只能通过后端环境变量注入。
    mineru:
      # 是否启用 MinerU 精准解析能力。
      enabled: ${LEGAL_MINERU_ENABLED:true}
      # MinerU API 基础地址。
      base-url: ${LEGAL_MINERU_BASE_URL:https://mineru.net}
      # MinerU API Token，禁止在仓库中写入真实 Token。
      api-token: ${LEGAL_MINERU_API_TOKEN:}
      # MinerU 模型版本，vlm 表示默认精准解析模型。
      model-version: ${LEGAL_MINERU_MODEL_VERSION:vlm}
      # MinerU 文档语言配置，ch 表示中文。
      language: ${LEGAL_MINERU_LANGUAGE:ch}
      # 是否启用 MinerU 表格识别。
      enable-table: ${LEGAL_MINERU_ENABLE_TABLE:true}
      # 是否启用 MinerU 公式识别。
      enable-formula: ${LEGAL_MINERU_ENABLE_FORMULA:true}
      # 是否启用 MinerU OCR。
      ocr: ${LEGAL_MINERU_OCR:false}
      # MinerU Markdown 父子分块触发与子块切分的最大字符数。
      chunk-size: ${LEGAL_MINERU_CHUNK_SIZE:800}
      # 是否启用 MinerU Markdown 相邻语义块合并。
      merge-enabled: ${LEGAL_MINERU_MERGE_ENABLED:true}
      # MinerU Markdown 相邻语义块合并时的最大字符数，仅在启用合并时生效。
      max-merge-size: ${LEGAL_MINERU_MAX_MERGE_SIZE:300}
      # MinerU Markdown 相邻短语义块合并时的目标最小字符数，仅在启用合并时生效。
      min-chunk-size: ${LEGAL_MINERU_MIN_CHUNK_SIZE:30}
      # MinerU 结果包图片资产处理配置。
      image-asset:
        # 是否启用 MinerU 结果包图片资产处理。
        enabled: ${LEGAL_MINERU_IMAGE_ASSET_ENABLED:true}
        # 单个文档最多处理的图片数量。
        max-images-per-document: ${LEGAL_MINERU_IMAGE_ASSET_MAX_IMAGES_PER_DOCUMENT:50}
        # 单张图片允许的最大字节数。
        max-image-bytes: ${LEGAL_MINERU_IMAGE_ASSET_MAX_IMAGE_BYTES:5242880}
        # 单个文档图片允许的最大总字节数。
        max-total-image-bytes: ${LEGAL_MINERU_IMAGE_ASSET_MAX_TOTAL_IMAGE_BYTES:52428800}
        # 允许处理的图片扩展名列表。
        supported-extensions: ${LEGAL_MINERU_IMAGE_ASSET_SUPPORTED_EXTENSIONS:jpg,jpeg,png,webp}
        # 图片增强失败时是否降级继续解析 Markdown 文本。
        continue-on-failure: ${LEGAL_MINERU_IMAGE_ASSET_CONTINUE_ON_FAILURE:true}
        # 被视为装饰图的最小图片字节数，小于该值会跳过图生文。
        min-meaningful-image-bytes: ${LEGAL_MINERU_IMAGE_ASSET_MIN_MEANINGFUL_IMAGE_BYTES:2048}
      # MinerU 图片图生文描述配置。
      image-caption:
        # 是否启用 MinerU 图片图生文描述。
        enabled: ${LEGAL_MINERU_IMAGE_CAPTION_ENABLED:true}
        # 图生文模型 OpenAI 兼容接口地址。
        base-url: ${LEGAL_MINERU_IMAGE_CAPTION_BASE_URL:${LEGAL_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
        # 图生文模型 API Key，默认复用在线问答模型 API Key。
        api-key: ${LEGAL_MINERU_IMAGE_CAPTION_API_KEY:${LEGAL_LLM_API_KEY:sk-8f14b342380c4e1ea5bbf457709c5f12}}
        # 图生文模型名称。
        model-name: ${LEGAL_MINERU_IMAGE_CAPTION_MODEL:qwen3.5-omni-plus}
        # 图生文模型调用超时时间。
        timeout: ${LEGAL_MINERU_IMAGE_CAPTION_TIMEOUT:60s}
        # 单张图片描述最大输出 Token 数。
        max-output-tokens: ${LEGAL_MINERU_IMAGE_CAPTION_MAX_OUTPUT_TOKENS:256}
        # 单个文档最多调用图生文模型处理的图片数量。
        max-images-per-document: ${LEGAL_MINERU_IMAGE_CAPTION_MAX_IMAGES_PER_DOCUMENT:50}
      # MinerU HTTP 连接超时时间。
      connect-timeout: ${LEGAL_MINERU_CONNECT_TIMEOUT:10s}
      # MinerU HTTP 读取超时时间。
      read-timeout: ${LEGAL_MINERU_READ_TIMEOUT:60s}
      # MinerU 单个解析任务总超时时间。
      timeout: ${LEGAL_MINERU_TIMEOUT:5m}
      # MinerU 解析结果轮询间隔。
      poll-interval: ${LEGAL_MINERU_POLL_INTERVAL:3s}
    # 文档解析后台 worker 配置。
    worker:
      # 是否启用文档解析后台 worker。
      enabled: ${LEGAL_DOCUMENT_PARSE_WORKER_ENABLED:true}
      # 文档解析 worker 轮询间隔毫秒数。
      poll-interval-ms: ${LEGAL_DOCUMENT_PARSE_WORKER_POLL_INTERVAL_MS:3000}
      # 单次 worker 最多处理的解析任务数量。
      batch-size: ${LEGAL_DOCUMENT_PARSE_WORKER_BATCH_SIZE:5}
      # 文档解析失败后允许的最大重试次数。
      max-retries: ${LEGAL_DOCUMENT_PARSE_WORKER_MAX_RETRIES:3}

  # 智能问答记忆管理配置。
  memory:
    # 是否启用智能问答记忆能力。
    enabled: ${LEGAL_MEMORY_ENABLED:true}
    # 会话消息缓存配置。
    cache:
      # Redis 中近期会话消息缓存的保留天数。
      messages-ttl-days: ${LEGAL_MEMORY_MESSAGES_TTL_DAYS:7}
    # 短期上下文记忆配置。
    short-term:
      # 构造上下文时最多携带多少条短期消息。
      max-messages: ${LEGAL_MEMORY_SHORT_MAX_MESSAGES:${LEGAL_RAG_MAX_MEMORY_MESSAGES:12}}
    # 会话摘要记忆配置。
    summary:
      # 是否启用会话摘要生成与刷新。
      enabled: ${LEGAL_MEMORY_SUMMARY_ENABLED:true}
      # 每累计多少轮对话后刷新一次摘要。
      refresh-rounds: ${LEGAL_MEMORY_SUMMARY_REFRESH_ROUNDS:12}
      # 生成摘要时向模型提供的最近消息条数。
      last-messages: ${LEGAL_MEMORY_SUMMARY_LAST_MESSAGES:20}
    # 长期记忆配置。
    long-term:
      # 是否启用长期记忆抽取与使用。
      enabled: ${LEGAL_MEMORY_LONG_TERM_ENABLED:true}
      # 单个用户最多保留多少条长期记忆。
      max-items: ${LEGAL_MEMORY_LONG_TERM_MAX_ITEMS:20}
      # 长期记忆入库所需的最低置信度。
      min-confidence: ${LEGAL_MEMORY_LONG_TERM_MIN_CONFIDENCE:0.6}
      # 同一事实达到多少次稳定出现后才进入长期记忆。
      stable-threshold: ${LEGAL_MEMORY_LONG_TERM_STABLE_THRESHOLD:2}
    # 用户外挂知识沉淀配置。
    user-knowledge:
      # 是否启用用户外挂知识召回与沉淀。
      enabled: ${LEGAL_MEMORY_USER_KNOWLEDGE_ENABLED:true}
      # 用户外挂知识召回的最大条数。
      top-k: ${LEGAL_MEMORY_USER_KNOWLEDGE_TOP_K:3}
      # 触发用户外挂知识沉淀的最小问题长度。
      min-question-length: ${LEGAL_MEMORY_USER_KNOWLEDGE_MIN_QUESTION_LENGTH:8}
    # 记忆后台任务配置。
    worker:
      # 是否启用记忆后台任务。
      enabled: ${LEGAL_MEMORY_WORKER_ENABLED:true}
      # 记忆后台任务轮询间隔毫秒数。
      poll-interval-ms: ${LEGAL_MEMORY_WORKER_POLL_INTERVAL_MS:3000}
      # 单次记忆后台任务最多处理的记录数。
      batch-size: ${LEGAL_MEMORY_WORKER_BATCH_SIZE:10}
      # 记忆任务失败后允许的最大重试次数。
      max-retries: ${LEGAL_MEMORY_WORKER_MAX_RETRIES:5}
      # 记忆任务失败后的重试延迟秒数。
      retry-delay-seconds: ${LEGAL_MEMORY_WORKER_RETRY_DELAY_SECONDS:30}

  # 智能小法庭（合同纠纷模拟庭审 + 证据链图谱 + 补证建议）配置。
  smart-court:
    # 是否启用智能小法庭功能总开关，关闭后相关接口拒绝服务。
    enabled: ${LEGAL_SMART_COURT_ENABLED:true}
    # 单案件最大允许的庭审轮数，超过后阻止开启新轮并引导生成报告。
    max-rounds: ${LEGAL_SMART_COURT_MAX_ROUNDS:8}
    # 单轮庭审 LLM 累计 token 上限，超限后终止本轮剩余 LLM 调用并标记失败。
    max-tokens-per-round: ${LEGAL_SMART_COURT_MAX_TOKENS_PER_ROUND:6000}
    # 单案件累计 token 上限，超限后阻止开启新轮以控制成本。
    max-tokens-per-case: ${LEGAL_SMART_COURT_MAX_TOKENS_PER_CASE:60000}
    # AI 角色发言 schema 校验失败后的最大整轮重试次数。
    evidence-ref-retry: ${LEGAL_SMART_COURT_EVIDENCE_REF_RETRY:2}
    # AI 法官输出双向不利点缺失时的整体重生成最大次数。
    judge-bilateral-retry: ${LEGAL_SMART_COURT_JUDGE_BILATERAL_RETRY:2}
    # 模拟裁判报告导出时附加的合规水印文案。
    report-watermark: ${LEGAL_SMART_COURT_REPORT_WATERMARK:仅供模拟参考、不构成法律意见}
    # 智能小法庭专用大模型配置，留空时按后端逻辑复用在线问答模型配置。
    llm:
      # 智能小法庭模型 OpenAI 兼容接口地址，留空时复用在线问答模型接口地址。
      base-url: ${LEGAL_SMART_COURT_LLM_BASE_URL:}
      # 智能小法庭模型 API Key，留空时复用在线问答模型 API Key。
      api-key: ${LEGAL_SMART_COURT_LLM_API_KEY:}
      # 智能小法庭模型名称，留空时复用在线问答模型名称。
      model-name: ${LEGAL_SMART_COURT_LLM_MODEL:deepseek-v4-pro}
      # 智能小法庭模型采样温度，留空时复用在线问答模型采样温度。
      temperature: ${LEGAL_SMART_COURT_LLM_TEMPERATURE:0.2}
      # 智能小法庭模型单次最大输出 token 数，留空时复用在线问答模型输出上限。
      max-output-tokens: ${LEGAL_SMART_COURT_LLM_MAX_OUTPUT_TOKENS:2048}
      # 智能小法庭模型调用超时时间，留空时复用在线问答模型超时时间。
      timeout: ${LEGAL_SMART_COURT_LLM_TIMEOUT:60s}
    # 庭审流程控制配置。
    hearing:
      # 默认庭审起始阶段，创建案件后首次进入的庭审阶段。
      initial-stage: ${LEGAL_SMART_COURT_HEARING_INITIAL_STAGE:OPENING_PLAINTIFF}
      # 是否允许用户手动推进庭审阶段，关闭后只能由系统状态机推进。
      manual-stage-transition-enabled: ${LEGAL_SMART_COURT_HEARING_MANUAL_STAGE_TRANSITION_ENABLED:true}
      # 单个庭审阶段允许的最大消息数量，超过后提示进入下一阶段。
      max-messages-per-stage: ${LEGAL_SMART_COURT_HEARING_MAX_MESSAGES_PER_STAGE:20}
      # 单轮庭审最大执行时长，超过后中断本轮并标记失败。
      round-timeout: ${LEGAL_SMART_COURT_HEARING_ROUND_TIMEOUT:180s}
      # 庭审轮次失败后的默认重试延迟时间。
      retry-delay: ${LEGAL_SMART_COURT_HEARING_RETRY_DELAY:10s}
    # 多角色 AI 模型与提示词配置。
    agent:
      # 法官角色使用的模型名称，留空时复用全局聊天模型。
      judge-model: ${LEGAL_SMART_COURT_AGENT_JUDGE_MODEL:${LEGAL_LLM_MODEL:deepseek-v4-pro}}
      # 对方代理人角色使用的模型名称，留空时复用全局聊天模型。
      opponent-model: ${LEGAL_SMART_COURT_AGENT_OPPONENT_MODEL:${LEGAL_LLM_MODEL:deepseek-v4-pro}}
      # 用户辅助律师角色使用的模型名称，留空时复用全局聊天模型。
      user-advisor-model: ${LEGAL_SMART_COURT_AGENT_USER_ADVISOR_MODEL:${LEGAL_LLM_MODEL:deepseek-v4-pro}}
      # 观众或旁听视角角色使用的模型名称，留空时复用全局聊天模型。
      audience-model: ${LEGAL_SMART_COURT_AGENT_AUDIENCE_MODEL:${LEGAL_LLM_MODEL:deepseek-v4-pro}}
      # 法官角色采样温度，建议低温以保证中立稳定。
      judge-temperature: ${LEGAL_SMART_COURT_AGENT_JUDGE_TEMPERATURE:0.1}
      # 对方代理人角色采样温度，允许略高以增强攻防变化。
      opponent-temperature: ${LEGAL_SMART_COURT_AGENT_OPPONENT_TEMPERATURE:0.2}
      # 用户辅助律师角色采样温度，建议偏低以保证建议可靠。
      user-advisor-temperature: ${LEGAL_SMART_COURT_AGENT_USER_ADVISOR_TEMPERATURE:0.15}
      # 观众视角采样温度，用于生成更通俗的旁听解释。
      audience-temperature: ${LEGAL_SMART_COURT_AGENT_AUDIENCE_TEMPERATURE:0.3}
      # 单次角色发言最大输出 token 数。
      max-output-tokens: ${LEGAL_SMART_COURT_AGENT_MAX_OUTPUT_TOKENS:1800}
      # 是否启用角色提示词隔离，开启后不同角色只接收允许范围内的上下文。
      prompt-isolation-enabled: ${LEGAL_SMART_COURT_AGENT_PROMPT_ISOLATION_ENABLED:true}
      # 是否强制法官输出原被告双方不利点，关闭后仅做普通总结。
      judge-bilateral-adverse-points-required: ${LEGAL_SMART_COURT_AGENT_JUDGE_BILATERAL_ADVERSE_POINTS_REQUIRED:true}
    # 庭审 RAG 检索上下文配置。
    retrieval:
      # 庭审上下文检索是否启用父级语义块扩展，命中子块后用父块发送给大模型。
      parent-context-enabled: ${LEGAL_SMART_COURT_RETRIEVAL_PARENT_CONTEXT_ENABLED:true}
      # 庭审每次检索返回给模型的最大上下文数量。
      top-k: ${LEGAL_SMART_COURT_RETRIEVAL_TOP_K:8}
      # 庭审检索向量召回的最小相似度阈值。
      min-vector-similarity: ${LEGAL_SMART_COURT_RETRIEVAL_MIN_VECTOR_SIMILARITY:0.75}
      # 单条证据上下文发送给模型前允许的最大字符数。
      max-context-chars-per-evidence: ${LEGAL_SMART_COURT_RETRIEVAL_MAX_CONTEXT_CHARS_PER_EVIDENCE:3000}
      # 单次角色发言允许携带的最大证据上下文总字符数。
      max-total-context-chars: ${LEGAL_SMART_COURT_RETRIEVAL_MAX_TOTAL_CONTEXT_CHARS:12000}
    # 证据引用真实性校验配置。
    evidence-validation:
      # 是否启用证据引用 schema 校验，检查 AI 输出是否符合 evidenceId/chunkId 等结构要求。
      schema-check-enabled: ${LEGAL_SMART_COURT_EVIDENCE_VALIDATION_SCHEMA_CHECK_ENABLED:true}
      # 是否启用案件证据白名单校验，防止引用未登记到案件的文档或证据。
      whitelist-check-enabled: ${LEGAL_SMART_COURT_EVIDENCE_VALIDATION_WHITELIST_CHECK_ENABLED:true}
      # 是否启用租户和用户归属校验，防止跨租户或跨用户引用证据。
      ownership-check-enabled: ${LEGAL_SMART_COURT_EVIDENCE_VALIDATION_OWNERSHIP_CHECK_ENABLED:true}
      # 是否丢弃未通过校验的证据引用，关闭后仅记录告警。
      drop-invalid-references: ${LEGAL_SMART_COURT_EVIDENCE_VALIDATION_DROP_INVALID_REFERENCES:true}
      # 单条观点允许引用的最大证据数量。
      max-references-per-argument: ${LEGAL_SMART_COURT_EVIDENCE_VALIDATION_MAX_REFERENCES_PER_ARGUMENT:10}
    # 补证建议配置。
    supplement:
      # 是否启用补证建议生成。
      enabled: ${LEGAL_SMART_COURT_SUPPLEMENT_ENABLED:true}
      # 是否允许 LLM 参与补证建议解释，规则识别仍以结构化图谱结果为准。
      llm-explanation-enabled: ${LEGAL_SMART_COURT_SUPPLEMENT_LLM_EXPLANATION_ENABLED:true}
      # 单案件最多保留的开放补证建议数量。
      max-open-suggestions-per-case: ${LEGAL_SMART_COURT_SUPPLEMENT_MAX_OPEN_SUGGESTIONS_PER_CASE:30}
      # 补证建议生成时默认最小严重等级，低于该等级的建议不展示。
      min-visible-severity: ${LEGAL_SMART_COURT_SUPPLEMENT_MIN_VISIBLE_SEVERITY:LOW}
      # 图谱更新后是否自动重新计算补证建议。
      refresh-on-graph-update: ${LEGAL_SMART_COURT_SUPPLEMENT_REFRESH_ON_GRAPH_UPDATE:true}
    # SSE 流式庭审输出配置。
    stream:
      # 是否启用庭审 SSE 流式输出。
      enabled: ${LEGAL_SMART_COURT_STREAM_ENABLED:true}
      # SSE 心跳发送间隔，避免长时间无输出被代理断开。
      heartbeat-interval: ${LEGAL_SMART_COURT_STREAM_HEARTBEAT_INTERVAL:15s}
      # SSE 连接最大保持时间，超过后由前端重新发起请求。
      max-duration: ${LEGAL_SMART_COURT_STREAM_MAX_DURATION:5m}
      # 用户停止流式输出后是否保存已生成的部分内容。
      save-partial-on-cancel: ${LEGAL_SMART_COURT_STREAM_SAVE_PARTIAL_ON_CANCEL:true}
    # 智能小法庭降级策略配置。
    degrade:
      # Neo4j 不可用时是否允许继续进行纯文本模拟庭审。
      allow-hearing-without-graph: ${LEGAL_SMART_COURT_DEGRADE_ALLOW_HEARING_WITHOUT_GRAPH:true}
      # LLM 调用失败时是否允许返回规则化兜底提示。
      allow-rule-fallback-on-llm-error: ${LEGAL_SMART_COURT_DEGRADE_ALLOW_RULE_FALLBACK_ON_LLM_ERROR:true}
      # RAG 检索无结果时是否允许继续生成程序性发言。
      allow-hearing-without-rag-hit: ${LEGAL_SMART_COURT_DEGRADE_ALLOW_HEARING_WITHOUT_RAG_HIT:false}
    # 智能小法庭审计与观测配置。
    observability:
      # 是否记录庭审角色调用摘要日志，不记录完整敏感原文。
      audit-log-enabled: ${LEGAL_SMART_COURT_OBSERVABILITY_AUDIT_LOG_ENABLED:true}
      # 是否记录图谱投影指标，用于后续接入 Actuator/Metrics。
      graph-metrics-enabled: ${LEGAL_SMART_COURT_OBSERVABILITY_GRAPH_METRICS_ENABLED:true}
      # 是否记录证据引用校验统计，用于排查 AI 幻觉引用。
      evidence-validation-metrics-enabled: ${LEGAL_SMART_COURT_OBSERVABILITY_EVIDENCE_VALIDATION_METRICS_ENABLED:true}
    # 证据链知识图谱相关配置。
    graph:
      # 是否启用 Neo4j 投影器，关闭后所有图谱事件保持 PENDING 状态等待人工启用。
      projector-enabled: ${LEGAL_SMART_COURT_GRAPH_PROJECTOR_ENABLED:true}
      # Cypher 多跳路径查询允许的最大跳数，硬性约束查询代价。
      max-hops: ${LEGAL_SMART_COURT_GRAPH_MAX_HOPS:4}
      # 单案件图谱节点数量上限，超过后拒绝写入新节点并告警。
      max-nodes-per-case: ${LEGAL_SMART_COURT_GRAPH_MAX_NODES_PER_CASE:2000}
      # 投影器单批消费 PENDING 事件的数量。
      projector-batch-size: ${LEGAL_SMART_COURT_GRAPH_PROJECTOR_BATCH_SIZE:50}
      # 投影器轮询间隔毫秒数。
      projector-poll-interval-ms: ${LEGAL_SMART_COURT_GRAPH_PROJECTOR_POLL_INTERVAL_MS:2000}
      # 投影器单事件最大重试次数，超过后置为 DEAD 并告警。
      projector-max-retries: ${LEGAL_SMART_COURT_GRAPH_PROJECTOR_MAX_RETRIES:5}
      # 案件级全量重建时按事件分页的页大小。
      rebuild-page-size: ${LEGAL_SMART_COURT_GRAPH_REBUILD_PAGE_SIZE:200}
      # 前端默认子图查询围绕争议焦点的跳数。
      default-focus-hops: ${LEGAL_SMART_COURT_GRAPH_DEFAULT_FOCUS_HOPS:2}
      # 前端默认子图查询返回节点数量上限。
      default-focus-node-limit: ${LEGAL_SMART_COURT_GRAPH_DEFAULT_FOCUS_NODE_LIMIT:200}

  # 合同审阅与风险识别配置。
  contract-review:
    # 合同审阅功能总开关，关闭后不允许触发审阅。
    enabled: ${LEGAL_CONTRACT_REVIEW_ENABLED:true}
    # 字段抽取相关配置。
    extraction:
      # 单个多值字段最多保留多少条抽取结果。
      max-repeatable-fields: ${LEGAL_CONTRACT_REVIEW_MAX_REPEATABLE_FIELDS:8}
      # 单条证据片段最大保留长度，超出会截断。
      max-evidence-length: ${LEGAL_CONTRACT_REVIEW_MAX_EVIDENCE_LENGTH:180}
    # 风险规则检索匹配配置。
    risk-rule-retrieval:
      # 是否启用导入风险规则的向量命中能力。
      enabled: ${LEGAL_CONTRACT_REVIEW_RISK_RULE_RETRIEVAL_ENABLED:true}
      # 单个审查切片最多召回多少条风险规则候选。
      top-k: ${LEGAL_CONTRACT_REVIEW_RISK_RULE_RETRIEVAL_TOP_K:3}
      # 向量命中的最小分数阈值。
      min-score: ${LEGAL_CONTRACT_REVIEW_RISK_RULE_RETRIEVAL_MIN_SCORE:0.78}
      # 单次审查最多保留多少条导入规则命中结果。
      max-hits-per-review: ${LEGAL_CONTRACT_REVIEW_RISK_RULE_RETRIEVAL_MAX_HITS_PER_REVIEW:5}
    # 审阅异步 worker 配置。
    worker:
      # 是否启用合同审阅后台任务轮询。
      enabled: ${LEGAL_CONTRACT_REVIEW_WORKER_ENABLED:true}
      # worker 轮询待处理任务的时间间隔（毫秒）。
      poll-interval-ms: ${LEGAL_CONTRACT_REVIEW_WORKER_POLL_INTERVAL_MS:3000}
      # 每次轮询最多拉取多少条审阅任务。
      batch-size: ${LEGAL_CONTRACT_REVIEW_WORKER_BATCH_SIZE:10}
      # 单条审阅任务允许的最大重试次数。
      max-retries: ${LEGAL_CONTRACT_REVIEW_WORKER_MAX_RETRIES:5}
      # 审阅任务失败后的重试延迟秒数。
      retry-delay-seconds: ${LEGAL_CONTRACT_REVIEW_WORKER_RETRY_DELAY_SECONDS:30}

# Elasticsearch 配置（文档向量索引 + 混合检索）。
elasticsearch:
  # 是否启用 Elasticsearch 检索与索引能力。
  enabled: ${LEGAL_ES_ENABLED:true}
  # Elasticsearch 集群访问地址列表。
  uris:
    # Elasticsearch 默认访问地址。
    - ${LEGAL_ES_URIS:http://159.75.84.229:9200}
  # Elasticsearch 用户名。
  username: ${LEGAL_ES_USERNAME:elastic}
  # Elasticsearch 密码，生产环境应通过环境变量注入。
  password: ${LEGAL_ES_PASSWORD:elastic99801}
  # Elasticsearch 连接建立超时时间。
  connect-timeout: ${LEGAL_ES_CONNECT_TIMEOUT:3s}
  # Elasticsearch Socket 读取超时时间。
  socket-timeout: ${LEGAL_ES_SOCKET_TIMEOUT:10s}
  # Elasticsearch 索引名称与向量维度配置。
  index:
    # 知识库文档切片索引名称。
    kb-chunks: ${LEGAL_ES_INDEX_KB_CHUNKS:legal_kb_chunks_v1}
    # MinerU 精准解析知识库文档切片索引名称。
    kb-chunks-mineru: ${LEGAL_ES_INDEX_KB_CHUNKS_MINERU:legal_kb_chunks_mineru}
    # 风险规则文档切片索引名称。
    risk-rule: ${LEGAL_ES_INDEX_RISK_RULE:legal_risk_rule}
    # 用户外挂知识索引名称。
    user-knowledge: ${LEGAL_ES_INDEX_USER_KNOWLEDGE:legal_kb_user_knowledge}
    # 向量索引维度，需与 Embedding 模型输出维度一致。
    vector-dims: ${LEGAL_ES_VECTOR_DIMS:${LEGAL_LLM_EMBEDDING_DIMENSIONS:1024}}

  # 混合检索参数配置。
  search:
    # 向量召回阶段返回的最大候选数量。
    vector-top-k: ${LEGAL_ES_VECTOR_TOP_K:40}
    # BM25 关键词召回阶段返回的最大候选数量。
    bm25-top-k: ${LEGAL_ES_BM25_TOP_K:40}
    # RRF 融合排序的平滑参数。
    rrf-k: ${LEGAL_ES_RRF_K:60}
    # 智能问答默认知识库检索索引范围，支持 NATIVE_ONLY、MINERU_ONLY、BOTH。
    default-knowledge-index-scope: ${LEGAL_QA_KNOWLEDGE_INDEX_SCOPE:NATIVE_ONLY}
  # Elasticsearch 异步索引 worker 配置。
  worker:
    # 是否启用 Elasticsearch 异步索引 worker。
    enabled: ${LEGAL_ES_WORKER_ENABLED:true}
    # 单次索引 worker 最多处理的任务数量。
    batch-size: ${LEGAL_ES_WORKER_BATCH_SIZE:10}
    # 索引 worker 轮询间隔毫秒数。
    poll-interval-ms: ${LEGAL_ES_WORKER_POLL_INTERVAL_MS:3000}
    # 索引任务失败后允许的最大重试次数。
    max-retries: ${LEGAL_ES_WORKER_MAX_RETRIES:5}
    # 索引任务失败后的重试延迟时间。
    retry-delay: ${LEGAL_ES_WORKER_RETRY_DELAY:30s}
